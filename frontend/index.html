<!doctype html>

<html lang="en">
    <head>
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/images/favicon_io/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/images/favicon_io/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/images/favicon_io/favicon-16x16.png"
        />
        <link rel="manifest" href="/images/favicon_io/site.webmanifest" />

        <meta property="og:title" content="PaperMatch" />
        <meta
            property="og:description"
            content=" Discover Relevant Research, Instantly ⚡"
        />
        <meta
            property="og:image"
            content="https://papermatch.me/images/logo.png"
        />
        <meta property="og:url" content="https://papermatch.me" />
        <meta property="og:type" content="website" />

        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <meta
            name="description"
            content="A semantic search engine for discovering papers on arXiv"
        />

        <title>PaperMatch</title>

        <link rel="stylesheet" href="styles/style.css" />

        <!--katex@0.16.23-->
        <link rel="stylesheet" href="styles/katex.min.css" />

        <!-- The loading of KaTeX is deferred to speed up page rendering -->
        <script defer src="scripts/katex.min.js"></script>

        <!-- To automatically render math in text elements, include the auto-render extension: -->
        <script defer src="scripts/auto-render.min.js"></script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Marcellus&family=Special+Elite&display=swap"
            rel="stylesheet"
        />

        <script async src="scripts/script.js"></script>
    </head>

    <body>
        <a href="/about.html">
            <h3 id="about_title" class="site_brand">About</h3>
        </a>

        <a href="/">
            <h1 id="site_title" class="site_brand">PaperMatch</h1>
        </a>

        <h3 id="site_subtitle" class="site_brand">
            Discover Relevant Research, Instantly ⚡
        </h3>

        <div id="input">
            <div class="search_container">
                <p>
                    <textarea
                        type="text"
                        id="search_input"
                        placeholder="Search                   arXiv papers"
                        autofocus
                    ></textarea>
                </p>

                <p>
                    <!--<label for="year_filter">Filter by year:</label>-->
                    <select name="category_filter" id="category_filter">
                        <option value="" selected>All categories</option>
                        <option
                            value='(categories LIKE "%cs.AI%" OR categories LIKE "%cs.AR%" OR categories LIKE "%cs.CC%" OR categories LIKE "%cs.CE%" OR categories LIKE "%cs.CG%" OR categories LIKE "%cs.CL%" OR categories LIKE "%cs.CR%" OR categories LIKE "%cs.CV%" OR categories LIKE "%cs.CY%" OR categories LIKE "%cs.DB%" OR categories LIKE "%cs.DC%" OR categories LIKE "%cs.DL%" OR categories LIKE "%cs.DM%" OR categories LIKE "%cs.DS%" OR categories LIKE "%cs.ET%" OR categories LIKE "%cs.FL%" OR categories LIKE "%cs.GL%" OR categories LIKE "%cs.GR%" OR categories LIKE "%cs.GT%" OR categories LIKE "%cs.HC%" OR categories LIKE "%cs.IR%" OR categories LIKE "%cs.IT%" OR categories LIKE "%cs.LG%" OR categories LIKE "%cs.LO%" OR categories LIKE "%cs.MA%" OR categories LIKE "%cs.MM%" OR categories LIKE "%cs.MS%" OR categories LIKE "%cs.NA%" OR categories LIKE "%cs.NE%" OR categories LIKE "%cs.NI%" OR categories LIKE "%cs.OH%" OR categories LIKE "%cs.OS%" OR categories LIKE "%cs.PF%" OR categories LIKE "%cs.PL%" OR categories LIKE "%cs.RO%" OR categories LIKE "%cs.SC%" OR categories LIKE "%cs.SD%" OR categories LIKE "%cs.SE%" OR categories LIKE "%cs.SI%" OR categories LIKE "%cs.SY%")'
                        >
                            Computer Science
                        </option>
                        <option
                            value='(categories LIKE "%econ.EM%" OR categories LIKE "%econ.GN%" OR categories LIKE "%econ.TH%")'
                        >
                            Economics
                        </option>
                        <option
                            value='(categories LIKE "%eess.AS%" OR categories LIKE "%eess.IV%" OR categories LIKE "%eess.SP%" OR categories LIKE "%eess.SY%")'
                        >
                            Electrical Engineering and Systems Science
                        </option>
                        <option
                            value='(categories LIKE "%math.AC%" OR categories LIKE "%math.AG%" OR categories LIKE "%math.AP%" OR categories LIKE "%math.AT%" OR categories LIKE "%math.CA%" OR categories LIKE "%math.CO%" OR categories LIKE "%math.CT%" OR categories LIKE "%math.CV%" OR categories LIKE "%math.DG%" OR categories LIKE "%math.DS%" OR categories LIKE "%math.FA%" OR categories LIKE "%math.GM%" OR categories LIKE "%math.GN%" OR categories LIKE "%math.GR%" OR categories LIKE "%math.GT%" OR categories LIKE "%math.HO%" OR categories LIKE "%math.IT%" OR categories LIKE "%math.KT%" OR categories LIKE "%math.LO%" OR categories LIKE "%math.MG%" OR categories LIKE "%math.MP%" OR categories LIKE "%math.NA%" OR categories LIKE "%math.NT%" OR categories LIKE "%math.OA%" OR categories LIKE "%math.OC%" OR categories LIKE "%math.PR%" OR categories LIKE "%math.QA%" OR categories LIKE "%math.RA%" OR categories LIKE "%math.RT%" OR categories LIKE "%math.SG%" OR categories LIKE "%math.SP%" OR categories LIKE "%math.ST%")'
                        >
                            Mathematics
                        </option>
                        <option
                            value='(categories LIKE "%astro-ph.CO%" OR categories LIKE "%astro-ph.EP%" OR categories LIKE "%astro-ph.GA%" OR categories LIKE "%astro-ph.HE%" OR categories LIKE "%astro-ph.IM%" OR categories LIKE "%astro-ph.SR%" OR categories LIKE "%cond-mat.dis-nn%" OR categories LIKE "%cond-mat.mes-hall%" OR categories LIKE "%cond-mat.mtrl-sci%" OR categories LIKE "%cond-mat.other%" OR categories LIKE "%cond-mat.quant-gas%" OR categories LIKE "%cond-mat.soft%" OR categories LIKE "%cond-mat.stat-mech%" OR categories LIKE "%cond-mat.str-el%" OR categories LIKE "%cond-mat.supr-con%" OR categories LIKE "%gr-qc%" OR categories LIKE "%hep-ex%" OR categories LIKE "%hep-lat%" OR categories LIKE "%hep-ph%" OR categories LIKE "%hep-th%" OR categories LIKE "%math-ph%" OR categories LIKE "%nlin.AO%" OR categories LIKE "%nlin.CD%" OR categories LIKE "%nlin.CG%" OR categories LIKE "%nlin.PS%" OR categories LIKE "%nlin.SI%" OR categories LIKE "%nucl-ex%" OR categories LIKE "%nucl-th%" OR categories LIKE "%physics.acc-ph%" OR categories LIKE "%physics.ao-ph%" OR categories LIKE "%physics.app-ph%" OR categories LIKE "%physics.atm-clus%" OR categories LIKE "%physics.atom-ph%" OR categories LIKE "%physics.bio-ph%" OR categories LIKE "%physics.chem-ph%" OR categories LIKE "%physics.class-ph%" OR categories LIKE "%physics.comp-ph%" OR categories LIKE "%physics.data-an%" OR categories LIKE "%physics.ed-ph%" OR categories LIKE "%physics.flu-dyn%" OR categories LIKE "%physics.gen-ph%" OR categories LIKE "%physics.geo-ph%" OR categories LIKE "%physics.hist-ph%" OR categories LIKE "%physics.ins-det%" OR categories LIKE "%physics.med-ph%" OR categories LIKE "%physics.optics%" OR categories LIKE "%physics.plasm-ph%" OR categories LIKE "%physics.pop-ph%" OR categories LIKE "%physics.soc-ph%" OR categories LIKE "%physics.space-ph%" OR categories LIKE "%quant-ph%")'
                        >
                            Physics
                        </option>
                        <option
                            value='(categories LIKE "%q-bio.BM%" OR categories LIKE "%q-bio.CB%" OR categories LIKE "%q-bio.GN%" OR categories LIKE "%q-bio.MN%" OR categories LIKE "%q-bio.NC%" OR categories LIKE "%q-bio.OT%" OR categories LIKE "%q-bio.PE%" OR categories LIKE "%q-bio.QM%" OR categories LIKE "%q-bio.SC%" OR categories LIKE "%q-bio.TO%")'
                        >
                            Quantitative Biology
                        </option>
                        <option
                            value='(categories LIKE "%q-fin.CP%" OR categories LIKE "%q-fin.EC%" OR categories LIKE "%q-fin.GN%" OR categories LIKE "%q-fin.MF%" OR categories LIKE "%q-fin.PM%" OR categories LIKE "%q-fin.PR%" OR categories LIKE "%q-fin.RM%" OR categories LIKE "%q-fin.ST%" OR categories LIKE "%q-fin.TR%")'
                        >
                            Quantitative Finance
                        </option>
                        <option
                            value='(categories LIKE "%stat.AP%" OR categories LIKE "%stat.CO%" OR categories LIKE "%stat.ME%" OR categories LIKE "%stat.ML%" OR categories LIKE "%stat.OT%" OR categories LIKE "%stat.TH%")'
                        >
                            Statistics
                        </option>
                    </select>

                    <select name="year_filter" id="year_filter"></select>

                    <button type="submit" id="search_button">Search</button>
                </p>
            </div>
        </div>

        <div id="results"></div>

        <a href="#search_input"><button id="to_top">↑</button></a>
    </body>
</html>
