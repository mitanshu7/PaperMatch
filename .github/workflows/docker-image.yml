# From https://stackoverflow.com/questions/77092191/use-github-to-change-visibility-of-ghcr-io-package
name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }} # important!

      - name: Build and push to Github registry
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ghcr.io/{{ github.repo }}/${{ matrix.image }}:latest
          file: ${{ matrix.dockerfile }}
