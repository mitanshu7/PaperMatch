[project]
name = "papermatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arxiv>=2.2.0",
    "backoff>=2.2.1",
    "beautifulsoup4>=4.14.3",
    "fastapi[standard]>=0.118.0",
    "mixedbread>=0.30.0",
    "pymilvus>=2.6.2",
    "python-dotenv>=1.1.1",
    "sentence-transformers>=5.3.0",
    "torch>=2.11.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
