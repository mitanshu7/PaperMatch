# From https://stackoverflow.com/questions/77092191/use-github-to-change-visibility-of-ghcr-io-package
name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }} # important!

      - name: Build and push to Github registry
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: docker.io/${{ vars.DOCKER_USERNAME }}/papermatch-backend:latest
          file: Dockerfile
